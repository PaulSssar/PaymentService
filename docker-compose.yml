version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      POSTGRES_DB: payment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      API_KEY: super-secret-api-key
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_pass@postgres:5432/payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEBUG: "true"
      LOG_LEVEL: INFO
      WEBHOOK_TIMEOUT: 10
      WEBHOOK_MAX_RETRIES: 3
      OUTBOX_POLL_INTERVAL: 2.0
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      bash -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_KEY: super-secret-api-key
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_pass@postgres:5432/payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEBUG: "true"
      LOG_LEVEL: INFO
      WEBHOOK_TIMEOUT: 10
      WEBHOOK_MAX_RETRIES: 3
      OUTBOX_POLL_INTERVAL: 2.0
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      bash -c "
        python -m app.workers.consumer
      "

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_KEY: super-secret-api-key
      DATABASE_URL: postgresql+asyncpg://payment_user:payment_pass@postgres:5432/payment_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      DEBUG: "true"
      LOG_LEVEL: INFO
      WEBHOOK_TIMEOUT: 10
      WEBHOOK_MAX_RETRIES: 3
      OUTBOX_POLL_INTERVAL: 2.0
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      bash -c "
        python -m app.workers.outbox_publisher
      "

volumes:
  postgres_data:
  rabbitmq_data:
